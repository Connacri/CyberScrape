name: Release Build (CYBER-VACUUM Production Release)

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Compute Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from git tags
        id: v
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          else
            LAST=$(git tag --sort=-v:refname | head -n1 || true)
            BASE="${LAST#v}"
            BASE=${BASE:-1.0.0}
            MAJ=$(echo "$BASE" | cut -d. -f1)
            MIN=$(echo "$BASE" | cut -d. -f2)
            PATC=$(echo "$BASE" | cut -d. -f3)
            COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "0")
            VER="${MAJ:-1}.${MIN:-0}.${PATC:-0}"
            TAG="v${VER}"
          fi
          TOTAL=$(git rev-list --count HEAD 2>/dev/null || echo "1")
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "build=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build Production Package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit
          else
            npm install --legacy-peer-deps --no-audit
          fi

      - name: TypeScript Lint & Typecheck
        run: npm run lint

      - name: Build Web Application
        env:
          VITE_BASE_URL: './'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Generate version.json
        run: |
          echo "{\"version\":\"${{ needs.version.outputs.version }}\",\"build\":\"${{ needs.version.outputs.build }}\",\"builtAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > dist/version.json

      - name: Package Release Bundle (ZIP)
        run: |
          mkdir -p release-pkg
          cp -r dist server.ts package.json package-lock.json .env.example release-pkg/ 2>/dev/null || cp -r dist server.ts package.json .env.example release-pkg/
          cp -r src release-pkg/src
          cd release-pkg && zip -r ../cyber-vacuum-v${{ needs.version.outputs.version }}-bundle.zip . && cd ..

      - name: Upload Release Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyber-vacuum-v${{ needs.version.outputs.version }}-bundle
          path: cyber-vacuum-v${{ needs.version.outputs.version }}-bundle.zip

  gh-release:
    name: Publish to GitHub Releases
    needs: [version, build-release]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Built Archive
        uses: actions/download-artifact@v4
        with:
          name: cyber-vacuum-v${{ needs.version.outputs.version }}-bundle

      - name: Create GitHub Release with Artifact
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CYBER-VACUUM MK-IV ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          files: cyber-vacuum-v${{ needs.version.outputs.version }}-bundle.zip
          body: |
            ## 🚀 CYBER-VACUUM MK-IV — Release ${{ needs.version.outputs.tag }}

            ### 📦 Inclus dans cette release :
            - **Package Web / Serveur Déployable** : `cyber-vacuum-v${{ needs.version.outputs.version }}-bundle.zip`
            - **Scraper E-Commerce & Algerian Marketplace Engine** (Ouedkniss, Amazon, Fnac, Nike, Temu).
            - **Moteur Hybride Haute Vitesse** (Mode Direct DOM sans quota & Mode IA Gemini).
            - **Synchronisation Supabase** & Base locale persistante IndexedDB / LocalStorage.
            - **Fiches Détaillées Vendeurs** avec Contact Direct Téléphone (`tel:`) et WhatsApp (`wa.me`).
