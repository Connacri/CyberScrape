name: CYBER-VACUUM CI & Typecheck

on:
  push:
    branches:
      - master
      - main
      - '**'
  pull_request:
    branches:
      - master
      - main

jobs:
  validate:
    name: Node ${{ matrix.node-version }} - CYBER-VACUUM Lint & Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm ci || npm install --no-audit --prefer-offline

      - name: TypeScript Lint & Typecheck
        run: npm run lint

      - name: Build Vite Client Application
        env:
          VITE_BASE_URL: './'
        run: npm run build

      - name: Check Backend Server Syntax & Scraper Core
        run: npx tsx --eval "console.log('CYBER-VACUUM core engine & server syntax validated successfully')"
