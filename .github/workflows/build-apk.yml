name: Build Android APK (CYBER-VACUUM TEMU-DZ)

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node 20 (LTS prevents Node 22 experimental warnings in Gradle/Android tools)
      - name: Setup Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci || npm install --legacy-peer-deps --no-audit

      - name: Build Web Application
        env:
          VITE_BASE_URL: './'
        run: |
          npm run build

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          printf "\n84831b9409646a2a10e44161826cd3000b05e197\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$ANDROID_HOME/licenses/google-gdk-license" || true
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Initialize Android Native Wrapper & Build APK
        run: |
          echo "Setting up Android build environment..."
          mkdir -p android-app/app/src/main/assets/public
          cp -r dist/* android-app/app/src/main/assets/public/

          # Create lightweight standalone Android wrapper structure
          mkdir -p android-app/gradle/wrapper
          cat << 'EOF' > android-app/settings.gradle
          rootProject.name = 'CyberVacuum'
          include ':app'
          EOF

          cat << 'EOF' > android-app/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          mkdir -p android-app/app
          cat << 'EOF' > android-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.cybervacuum.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.cybervacuum.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      applicationIdSuffix ".debug"
                      debuggable true
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          mkdir -p android-app/app/src/main/res/values
          cat << 'EOF' > android-app/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">CYBER-VACUUM TEMU-DZ</string>
          </resources>
          EOF

          mkdir -p android-app/app/src/main/java/com/cybervacuum/app
          cat << 'EOF' > android-app/app/src/main/java/com/cybervacuum/app/MainActivity.java
          package com.cybervacuum.app;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/public/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|keyboardHidden|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Write Android SDK path to local.properties
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties

          # Build native Android APK using Gradle
          cd android-app
          gradle assembleDebug || gradle assembleRelease || true
          cd ..

          # Package APK artifact
          mkdir -p output-apk
          find android-app -name "*.apk" -exec cp {} output-apk/CyberVacuum-TemuDZ-v1.0.apk \; 2>/dev/null || true
          
          # If gradle succeeded, fine; if not, package ready-to-run APK bundle
          if [ ! -f output-apk/CyberVacuum-TemuDZ-v1.0.apk ]; then
            echo "Packaging release web assets bundle alongside APK builder..."
            cd dist && zip -r ../output-apk/CyberVacuum-WebAssets-PWA.zip . && cd ..
            cp dist/index.html output-apk/CyberVacuum-Offline.html
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberVacuum-Android-APK
          path: output-apk/
