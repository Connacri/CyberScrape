name: Build & Sign Android APK (CYBER-VACUUM)

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publier automatiquement sur GitHub Releases'
        required: false
        type: boolean
        default: true
      custom_tag:
        description: 'Nom du tag (ex: v1.0.0 - laisser vide pour auto)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build-and-sign-apk:
    name: Build, Sign & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compute Version Tag (Auto-increments with run_number on main/master)
      - name: Determine Version
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          elif [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            TAG="${{ github.event.inputs.custom_tag }}"
            VER="${TAG#v}"
          else
            RUN_NUM="${{ github.run_number }}"
            VER="1.0.${RUN_NUM}"
            TAG="v${VER}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Building version: $VER (tag: $TAG)"

      # Setup Node.js 20 LTS for building web assets
      - name: Setup Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci || npm install --legacy-peer-deps --no-audit

      - name: TypeScript Lint & Typecheck
        run: npm run lint

      - name: Build Web Application
        env:
          VITE_BASE_URL: './'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm run build

      # Setup Java 17 for Gradle
      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          printf "\n84831b9409646a2a10e44161826cd3000b05e197\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$ANDROID_HOME/licenses/google-gdk-license" || true
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi

      # Setup Keystore from GitHub Secrets (or dynamic fallback)
      - name: Prepare Keystore from GitHub Secrets
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android-app/keystore

          # Determine keystore credentials with defaults if secrets are empty
          STORE_PASS="${KEYSTORE_PASSWORD:-cybervacuum123}"
          ALIAS="${KEY_ALIAS:-cybervacuum}"
          ALIAS_PASS="${KEY_PASSWORD:-$STORE_PASS}"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Decoding Android Keystore from GitHub Secret ANDROID_KEYSTORE_BASE64..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-app/keystore/release.keystore
            echo "is_custom_secret=true" >> $GITHUB_OUTPUT
          else
            echo "GitHub Secret ANDROID_KEYSTORE_BASE64 not set. Generating valid release keystore dynamically..."
            keytool -genkey -v \
              -keystore android-app/keystore/release.keystore \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$ALIAS_PASS" \
              -dname "CN=CyberVacuum, OU=Mobile, O=CyberVacuum, L=Algiers, C=DZ"
            echo "is_custom_secret=false" >> $GITHUB_OUTPUT
          fi

          echo "KEYSTORE_PATH=keystore/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=$ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$ALIAS_PASS" >> $GITHUB_ENV

      # Generate Android Native Wrapper Project with Signing Config
      - name: Configure Android Project & Build Signed APK
        run: |
          mkdir -p android-app/app/src/main/assets/public
          cp -r dist/* android-app/app/src/main/assets/public/

          mkdir -p android-app/gradle/wrapper

          # CRITICAL FIX: android.useAndroidX=true is required by AndroidX dependencies
          cat << EOF > android-app/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          RELEASE_STORE_FILE=../keystore/release.keystore
          RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$KEY_ALIAS
          RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

          cat << 'EOF' > android-app/settings.gradle
          rootProject.name = 'CyberVacuum'
          include ':app'
          EOF

          cat << 'EOF' > android-app/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          mkdir -p android-app/app
          cat << EOF > android-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.cybervacuum.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.cybervacuum.app"
                  minSdk 24
                  targetSdk 34
                  versionCode ${{ github.run_number }}
                  versionName "${{ steps.versioning.outputs.version }}"
              }

              signingConfigs {
                  release {
                      storeFile file(project.findProperty('RELEASE_STORE_FILE') ?: '../keystore/release.keystore')
                      storePassword project.findProperty('RELEASE_STORE_PASSWORD') ?: ''
                      keyAlias project.findProperty('RELEASE_KEY_ALIAS') ?: ''
                      keyPassword project.findProperty('RELEASE_KEY_PASSWORD') ?: ''
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
                  debug {
                      applicationIdSuffix ".debug"
                      debuggable true
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          mkdir -p android-app/app/src/main/res/values
          cat << 'EOF' > android-app/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">CYBER-VACUUM</string>
          </resources>
          EOF

          cat << 'EOF' > android-app/app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.CyberVacuum" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#030712</item>
                  <item name="android:statusBarColor">#030712</item>
              </style>
          </resources>
          EOF

          mkdir -p android-app/app/src/main/assets/assets
          cp -r dist/* android-app/app/src/main/assets/
          cp -r dist/assets/* android-app/app/src/main/assets/assets/ 2>/dev/null || true
          cp -r dist/assets/* android-app/app/src/main/assets/ 2>/dev/null || true
          mkdir -p android-app/app/src/main/assets/public
          cp -r dist/* android-app/app/src/main/assets/public/

          mkdir -p android-app/app/src/main/java/com/cybervacuum/app
          cat << 'EOF' > android-app/app/src/main/java/com/cybervacuum/app/MainActivity.java
          package com.cybervacuum.app;

          import android.os.Bundle;
          import android.net.Uri;
          import android.webkit.ConsoleMessage;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  // Eliminate white flash: set dark cyberpunk background immediately
                  webView.setBackgroundColor(0xFF030712);
                  setContentView(webView);

                  // Assets loader serves local assets as a secure HTTPS origin to eliminate file:// CORS blocks on ES modules
                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                      .setDomain("appassets.androidplatform.net")
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .addPathHandler("/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onConsoleMessage(ConsoleMessage consoleMessage) {
                          android.util.Log.d("CyberVacuumJS", consoleMessage.message() + " [" + consoleMessage.sourceId() + ":" + consoleMessage.lineNumber() + "]");
                          return true;
                      }
                  });

                  webView.setWebViewClient(new WebViewClientCompat() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      @SuppressWarnings("deprecation")
                      public WebResourceResponse shouldInterceptRequest(WebView view, String url) {
                          return assetLoader.shouldInterceptRequest(Uri.parse(url));
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          if (scheme != null && (scheme.equals("tel") || scheme.equals("sms") || scheme.equals("mailto") || scheme.equals("whatsapp"))) {
                              try {
                                  android.content.Intent intent = new android.content.Intent(android.content.Intent.ACTION_VIEW, uri);
                                  startActivity(intent);
                                  return true;
                              } catch (Exception ignored) {
                                  return true;
                              }
                          }
                          if (uri.getHost() != null && !uri.getHost().equals("appassets.androidplatform.net")) {
                              try {
                                  android.content.Intent intent = new android.content.Intent(android.content.Intent.ACTION_VIEW, uri);
                                  startActivity(intent);
                                  return true;
                              } catch (Exception ignored) {
                                  return false;
                              }
                          }
                          return false;
                      }

                      @Override
                      public void onReceivedError(WebView view, int errorCode, String description, String failingUrl) {
                          android.util.Log.e("CyberVacuum", "WebView error: " + description + " at " + failingUrl);
                      }
                  });

                  // Load via secure asset loader origin to avoid Chromium file:// ES Module CORS restrictions
                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.CyberVacuum">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|keyboardHidden|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties

          echo "Compiling and signing release APK with Gradle..."
          cd android-app
          gradle assembleRelease --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
          cd ..

      # Package and verify the output APKs
      - name: Package & Generate Checksums
        run: |
          mkdir -p output-apk
          VER="${{ steps.versioning.outputs.version }}"

          # Locate generated APKs in build directories
          RELEASE_APK=$(find android-app -name "*release*.apk" | head -n 1)
          DEBUG_APK=$(find android-app -name "*debug*.apk" | head -n 1)

          if [ -f "$RELEASE_APK" ]; then
            echo "Found Release APK: $RELEASE_APK"
            cp "$RELEASE_APK" "output-apk/CyberVacuum-v${VER}-signed-release.apk"
          fi

          if [ -f "$DEBUG_APK" ]; then
            echo "Found Debug APK: $DEBUG_APK"
            cp "$DEBUG_APK" "output-apk/CyberVacuum-v${VER}-debug.apk"
          fi

          # Fallback if APK name differed
          if [ ! -f "output-apk/CyberVacuum-v${VER}-signed-release.apk" ]; then
            ANY_APK=$(find android-app -name "*.apk" | head -n 1)
            if [ -n "$ANY_APK" ]; then
              cp "$ANY_APK" "output-apk/CyberVacuum-v${VER}-signed-release.apk"
            fi
          fi

          # Always include web assets bundle
          cd dist && zip -r "../output-apk/CyberVacuum-v${VER}-WebBundle.zip" . && cd ..

          # Generate SHA-256 Checksums
          cd output-apk
          sha256sum * > SHA256SUMS.txt
          echo "=== SHA256 CHECKSUMS GENERATED ==="
          cat SHA256SUMS.txt
          cd ..

      # Upload Artifacts to Workflow Run
      - name: Upload APK & Checksums Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CyberVacuum-Android-APK-${{ steps.versioning.outputs.tag }}
          path: output-apk/

      # Publish directly to GitHub Releases (runs on push to main/master, tags, or workflow dispatch)
      - name: Publish Signed APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CYBER-VACUUM MK-IV ${{ steps.versioning.outputs.tag }} (Signed APK)
          draft: false
          prerelease: false
          make_latest: true
          files: |
            output-apk/*
          body: |
            ## 📱 CYBER-VACUUM Android APK — Release ${{ steps.versioning.outputs.tag }}

            ### 🔐 Signature & Sécurité :
            - **APK Signé Officiellement** via GitHub Actions Keystore (`v1` + `v2` APK Signature Scheme).
            - **Vérification d'intégrité SHA-256** incluse dans le fichier `SHA256SUMS.txt`.
            - **Compatible Android 7.0+** (API 24 à API 34).

            ### 📦 Fichiers Disponibles au Téléchargement Immédiat :
            1. **`CyberVacuum-v${{ steps.versioning.outputs.version }}-signed-release.apk`** : Application Android officielle signée prête à être installée sur smartphone.
            2. **`CyberVacuum-v${{ steps.versioning.outputs.version }}-debug.apk`** : Version de débogage pour les développeurs.
            3. **`CyberVacuum-v${{ steps.versioning.outputs.version }}-WebBundle.zip`** : Package Web complet prêt pour hébergement.
            4. **`SHA256SUMS.txt`** : Empreintes de contrôle cryptographiques.

            ### ⚡ Fonctionnalités Clés :
            - **Aspiration Haute Vitesse Ouedkniss & E-Commerce** (mode instantané sans quota & mode IA Gemini).
            - **Marketplace TEMU-DZ & Ventes Flash** en Dinars Algériens (DA).
            - **Appel Téléphonique Direct 1-Clic (`tel:`) et WhatsApp Direct (`wa.me`)**.
            - **Stockage Local Hors-Ligne & Synchronisation Cloud Supabase**.
