<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0a1826" />
      <stop offset="70%" stop-color="#030712" />
      <stop offset="100%" stop-color="#010307" />
    </radialGradient>

    <!-- Neon Emerald Glow -->
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00ff66" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="url(#neonEmerald)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Outer Energy Ring with notches -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#neonEmerald)" stroke-width="3" stroke-dasharray="14 10 30 10" filter="url(#glowFilter)" opacity="0.8" />
  <circle cx="256" cy="256" r="172" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" />

  <!-- Vortex Vacuum Turbine Blades (Cyber Vacuum Core) -->
  <g transform="translate(256, 256)" filter="url(#intenseGlow)">
    <path d="M 0 -130 C 45 -110 75 -60 55 0 C 40 -40 20 -90 0 -130 Z" fill="url(#neonEmerald)" opacity="0.9" />
    <path d="M 130 0 C 110 45 60 75 0 55 C 40 40 90 20 130 0 Z" fill="url(#neonCyan)" opacity="0.9" transform="rotate(45)" />
    <path d="M 0 130 C -45 110 -75 60 -55 0 C -40 40 -20 90 0 130 Z" fill="url(#neonEmerald)" opacity="0.9" transform="rotate(90)" />
    <path d="M -130 0 C -110 -45 -60 -75 0 -55 C -40 -40 -90 -20 -130 0 Z" fill="url(#neonCyan)" opacity="0.9" transform="rotate(135)" />
    <path d="M 0 -130 C 45 -110 75 -60 55 0 C 40 -40 20 -90 0 -130 Z" fill="url(#neonEmerald)" opacity="0.9" transform="rotate(180)" />
    <path d="M 130 0 C 110 45 60 75 0 55 C 40 40 90 20 130 0 Z" fill="url(#neonCyan)" opacity="0.9" transform="rotate(225)" />
    <path d="M 0 130 C -45 110 -75 60 -55 0 C -40 40 -20 90 0 130 Z" fill="url(#neonEmerald)" opacity="0.9" transform="rotate(270)" />
    <path d="M -130 0 C -110 -45 -60 -75 0 -55 C -40 -40 -90 -20 -130 0 Z" fill="url(#neonCyan)" opacity="0.9" transform="rotate(315)" />

    <circle cx="0" cy="0" r="44" fill="#030712" stroke="url(#neonEmerald)" stroke-width="4" />
    <circle cx="0" cy="0" r="28" fill="#00ff66" opacity="0.85" filter="url(#intenseGlow)" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
  </g>

  <g transform="translate(256, 458)" text-anchor="middle">
    <text font-family="'Orbitron', sans-serif" font-weight="900" font-size="28" fill="#00ff66" letter-spacing="4" filter="url(#glowFilter)">CYBER-VACUUM</text>
  </g>
</svg>
